<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone 1 Survival</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    overflow: hidden;
    background: #080b10;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #10151c;
    cursor: crosshair;
  }
  #hud {
    position: fixed;
    inset: 0 0 auto 0;
    display: flex;
    justify-content: space-between;
    padding: 18px 22px;
    pointer-events: none;
    font-weight: 700;
    text-shadow: 0 2px 5px #000;
  }
  .panel {
    background: rgba(5, 8, 12, .72);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 10px 14px;
    backdrop-filter: blur(8px);
  }
  #message, #gameOver {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(5,8,12,.9);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;
    padding: 28px 34px;
    box-shadow: 0 20px 80px rgba(0,0,0,.5);
  }
  #message h1, #gameOver h1 {
    margin: 0 0 10px;
    letter-spacing: 2px;
  }
  #message p, #gameOver p { opacity: .8; }
  button {
    margin-top: 14px;
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    background: #e9eef5;
    color: #0a0d12;
    font-weight: 800;
    cursor: pointer;
  }
  #gameOver { display: none; }
  #tips {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.65);
    font-size: 13px;
    pointer-events: none;
    text-align: center;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    ❤️ HP: <span id="hp">100</span>
    &nbsp;&nbsp; 🔫 Ammo: <span id="ammo">60</span>
  </div>
  <div class="panel">
    ☠ Kills: <span id="kills">0</span>
    &nbsp;&nbsp; 🌊 Wave: <span id="wave">1</span>
    &nbsp;&nbsp; ⭐ Score: <span id="score">0</span>
  </div>
</div>

<div id="message">
  <h1>ZONE 1 SURVIVAL</h1>
  <p>Выживи как можно дольше.</p>
  <p>WASD — движение · мышь — прицел · ЛКМ — огонь · R — перезарядка</p>
  <button id="startBtn">START</button>
</div>

<div id="gameOver">
  <h1>YOU DIED</h1>
  <p>Волна: <span id="finalWave">1</span> · Убийств: <span id="finalKills">0</span></p>
  <p>Счёт: <span id="finalScore">0</span></p>
  <button id="restartBtn">PLAY AGAIN</button>
</div>

<div id="tips">Зелёные аптечки восстанавливают HP · Жёлтые патроны дают +20 ammo</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const hpEl = document.getElementById("hp");
const ammoEl = document.getElementById("ammo");
const killsEl = document.getElementById("kills");
const waveEl = document.getElementById("wave");
const scoreEl = document.getElementById("score");

const message = document.getElementById("message");
const gameOver = document.getElementById("gameOver");
const finalWave = document.getElementById("finalWave");
const finalKills = document.getElementById("finalKills");
const finalScore = document.getElementById("finalScore");

let W = innerWidth, H = innerHeight;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

const keys = {};
const mouse = { x: W/2, y: H/2, down: false };

addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "r") reload();
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});
canvas.addEventListener("mousedown", () => mouse.down = true);
addEventListener("mouseup", () => mouse.down = false);

const state = {
  running: false,
  player: null,
  enemies: [],
  bullets: [],
  enemyBullets: [],
  pickups: [],
  particles: [],
  kills: 0,
  score: 0,
  wave: 1,
  spawnTimer: 0,
  nextWaveTimer: 0,
  shootingTimer: 0,
  reloading: false,
  reloadTimer: 0
};

function resetGame() {
  state.running = true;
  state.player = {
    x: W/2, y: H/2, r: 16,
    speed: 270,
    hp: 100, maxHp: 100,
    ammo: 60, mag: 60
  };
  state.enemies = [];
  state.bullets = [];
  state.enemyBullets = [];
  state.pickups = [];
  state.particles = [];
  state.kills = 0;
  state.score = 0;
  state.wave = 1;
  state.spawnTimer = 0;
  state.nextWaveTimer = 0;
  state.shootingTimer = 0;
  state.reloading = false;
  state.reloadTimer = 0;
  message.style.display = "none";
  gameOver.style.display = "none";

  for (let i = 0; i < 5; i++) spawnEnemy();
  updateHud();
}

function spawnEnemy() {
  const edge = Math.floor(Math.random() * 4);
  let x, y;
  if (edge === 0) { x = Math.random()*W; y = -30; }
  if (edge === 1) { x = W+30; y = Math.random()*H; }
  if (edge === 2) { x = Math.random()*W; y = H+30; }
  if (edge === 3) { x = -30; y = Math.random()*H; }

  const tough = Math.random() < Math.min(.12 + state.wave*.02, .4);
  state.enemies.push({
    x, y,
    r: tough ? 20 : 15,
    hp: tough ? 80 + state.wave*10 : 35 + state.wave*5,
    maxHp: tough ? 80 + state.wave*10 : 35 + state.wave*5,
    speed: tough ? 65 + state.wave*2 : 85 + state.wave*3,
    damage: tough ? 16 : 9,
    color: tough ? "#b86bff" : "#ff5454",
    cooldown: Math.random()*1.2
  });
}

function shoot() {
  if (!state.running || state.reloading || state.shootingTimer > 0) return;
  if (state.player.ammo <= 0) {
    reload();
    return;
  }

  const p = state.player;
  const dx = mouse.x - p.x;
  const dy = mouse.y - p.y;
  const len = Math.hypot(dx, dy) || 1;

  state.bullets.push({
    x: p.x + dx/len*18,
    y: p.y + dy/len*18,
    vx: dx/len*780,
    vy: dy/len*780,
    life: .9,
    damage: 28
  });

  state.player.ammo--;
  state.shootingTimer = .12;
  burst(p.x + dx/len*18, p.y + dy/len*18, "#ffd15c", 4);
}

function reload() {
  if (!state.running || state.reloading || state.player.ammo >= state.player.mag) return;
  state.reloading = true;
  state.reloadTimer = 1.1;
}

function damagePlayer(amount) {
  state.player.hp -= amount;
  burst(state.player.x, state.player.y, "#ff5454", 8);
  if (state.player.hp <= 0) endGame();
}

function endGame() {
  state.running = false;
  finalWave.textContent = state.wave;
  finalKills.textContent = state.kills;
  finalScore.textContent = state.score;
  gameOver.style.display = "block";
}

function spawnPickup(x, y) {
  if (Math.random() > .28) return;
  state.pickups.push({
    x, y,
    r: 11,
    type: Math.random() < .55 ? "med" : "ammo",
    life: 10
  });
}

function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random()*Math.PI*2;
    const s = 40 + Math.random()*180;
    state.particles.push({
      x, y,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s,
      life: .35 + Math.random()*.35,
      color
    });
  }
}

function dist(a,b) {
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function update(dt) {
  if (!state.running) return;

  const p = state.player;

  // movement
  let mx = 0, my = 0;
  if (keys.w) my -= 1;
  if (keys.s) my += 1;
  if (keys.a) mx -= 1;
  if (keys.d) mx += 1;
  if (mx || my) {
    const len = Math.hypot(mx,my);
    p.x += mx/len*p.speed*dt;
    p.y += my/len*p.speed*dt;
  }
  p.x = Math.max(22, Math.min(W-22, p.x));
  p.y = Math.max(22, Math.min(H-22, p.y));

  if (mouse.down) shoot();
  if (state.shootingTimer > 0) state.shootingTimer -= dt;

  if (state.reloading) {
    state.reloadTimer -= dt;
    if (state.reloadTimer <= 0) {
      p.ammo = p.mag;
      state.reloading = false;
    }
  }

  // spawn enemies
  state.spawnTimer -= dt;
  const maxEnemies = Math.min(8 + state.wave*3, 42);
  if (state.spawnTimer <= 0 && state.enemies.length < maxEnemies) {
    spawnEnemy();
    state.spawnTimer = Math.max(.35, 1.2 - state.wave*.035);
  }

  // bullets
  for (let i=state.bullets.length-1; i>=0; i--) {
    const b = state.bullets[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.life -= dt;

    let remove = b.life <= 0 || b.x < -50 || b.x > W+50 || b.y < -50 || b.y > H+50;

    for (let j=state.enemies.length-1; j>=0 && !remove; j--) {
      const e = state.enemies[j];
      if (dist(b,e) < e.r + 4) {
        e.hp -= b.damage;
        burst(b.x,b.y,"#ffd15c",3);
        remove = true;

        if (e.hp <= 0) {
          state.kills++;
          state.score += e.r >= 20 ? 150 : 100;
          spawnPickup(e.x,e.y);
          burst(e.x,e.y,e.color,12);
          state.enemies.splice(j,1);
        }
      }
    }
    if (remove) state.bullets.splice(i,1);
  }

  // enemies
  for (let i=state.enemies.length-1; i>=0; i--) {
    const e = state.enemies[i];
    const dx = p.x - e.x;
    const dy = p.y - e.y;
    const len = Math.hypot(dx,dy) || 1;

    if (len > p.r + e.r) {
      e.x += dx/len*e.speed*dt;
      e.y += dy/len*e.speed*dt;
    } else {
      e.cooldown -= dt;
      if (e.cooldown <= 0) {
        damagePlayer(e.damage);
        e.cooldown = .9;
      }
    }
  }

  // pickups
  for (let i=state.pickups.length-1; i>=0; i--) {
    const q = state.pickups[i];
    q.life -= dt;
    if (dist(q,p) < 28) {
      if (q.type === "med") p.hp = Math.min(p.maxHp, p.hp + 25);
      else p.ammo += 20;
      burst(q.x,q.y,q.type === "med" ? "#5cff8d" : "#ffd15c",8);
      state.pickups.splice(i,1);
    } else if (q.life <= 0) {
      state.pickups.splice(i,1);
    }
  }

  // particles
  for (let i=state.particles.length-1; i>=0; i--) {
    const a = state.particles[i];
    a.x += a.vx*dt;
    a.y += a.vy*dt;
    a.vx *= .95;
    a.vy *= .95;
    a.life -= dt;
    if (a.life <= 0) state.particles.splice(i,1);
  }

  // new wave after clearing enough pressure
  if (state.enemies.length === 0) {
    state.nextWaveTimer += dt;
    if (state.nextWaveTimer > 1.2) {
      state.wave++;
      state.score += 250;
      p.ammo = Math.min(p.mag, p.ammo + 20);
      state.nextWaveTimer = 0;
      for (let i=0; i<Math.min(4 + state.wave, 15); i++) spawnEnemy();
    }
  } else {
    state.nextWaveTimer = 0;
  }

  updateHud();
}

function updateHud() {
  hpEl.textContent = Math.max(0, Math.ceil(state.player?.hp ?? 100));
  ammoEl.textContent = state.player ? state.player.ammo + (state.reloading ? " (RELOAD)" : "") : 60;
  killsEl.textContent = state.kills;
  waveEl.textContent = state.wave;
  scoreEl.textContent = state.score;
}

function drawGrid() {
  ctx.fillStyle = "#10151c";
  ctx.fillRect(0,0,W,H);

  const size = 48;
  ctx.strokeStyle = "rgba(255,255,255,.035)";
  ctx.lineWidth = 1;

  for (let x=0; x<=W; x+=size) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y=0; y<=H; y+=size) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function draw() {
  drawGrid();

  // zone boundary
  ctx.strokeStyle = "rgba(82, 170, 255, .20)";
  ctx.lineWidth = 3;
  ctx.strokeRect(14,14,W-28,H-28);

  // pickups
  for (const q of state.pickups) {
    ctx.save();
    ctx.translate(q.x,q.y);
    ctx.globalAlpha = Math.min(1,q.life);
    ctx.fillStyle = q.type === "med" ? "#5cff8d" : "#ffd15c";
    ctx.beginPath(); ctx.arc(0,0,q.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#0b1016";
    if (q.type === "med") {
      ctx.fillRect(-6,-2,12,4);
      ctx.fillRect(-2,-6,4,12);
    } else {
      ctx.fillRect(-5,-7,10,14);
      ctx.fillRect(-7,-3,14,4);
    }
    ctx.restore();
  }

  // bullets
  ctx.fillStyle = "#ffd15c";
  for (const b of state.bullets) {
    ctx.beginPath();
    ctx.arc(b.x,b.y,3,0,Math.PI*2);
    ctx.fill();
  }

  // enemies
  for (const e of state.enemies) {
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(0, e.r+7, e.r+5, 6, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(0,0,e.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#171b22";
    ctx.beginPath();
    ctx.arc(-5,-3,2.5,0,Math.PI*2);
    ctx.arc(5,-3,2.5,0,Math.PI*2);
    ctx.fill();

    // HP bar
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(-e.r,-e.r-10,e.r*2,4);
    ctx.fillStyle = "#66e38d";
    ctx.fillRect(-e.r,-e.r-10,e.r*2*(e.hp/e.maxHp),4);
    ctx.restore();
  }

  // player
  const p = state.player;
  if (p) {
    const angle = Math.atan2(mouse.y-p.y, mouse.x-p.x);

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(angle);

    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(0,22,20,7,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#46a6ff";
    ctx.beginPath();
    ctx.arc(0,0,p.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#dbe9ff";
    ctx.fillRect(6,-4,25,8);

    ctx.restore();

    // aim line
    ctx.strokeStyle = "rgba(255,255,255,.10)";
    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(mouse.x,mouse.y);
    ctx.stroke();
  }

  // particles
  for (const a of state.particles) {
    ctx.globalAlpha = Math.max(0,a.life/.7);
    ctx.fillStyle = a.color;
    ctx.beginPath();
    ctx.arc(a.x,a.y,2.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // crosshair
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mouse.x-10,mouse.y); ctx.lineTo(mouse.x-3,mouse.y);
  ctx.moveTo(mouse.x+3,mouse.y); ctx.lineTo(mouse.x+10,mouse.y);
  ctx.moveTo(mouse.x,mouse.y-10); ctx.lineTo(mouse.x,mouse.y-3);
  ctx.moveTo(mouse.x,mouse.y+3); ctx.lineTo(mouse.x,mouse.y+10);
  ctx.stroke();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now-last)/1000, .033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById("startBtn").onclick = resetGame;
document.getElementById("restartBtn").onclick = resetGame;
</script>
</body>
</html>
